services:
  api:
    build:
      context: .
      dockerfile: api_service/Dockerfile
    container_name: gid-admin-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env before starting}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env before starting}


  web:
    build:
      context: .
      dockerfile: web_service/Dockerfile
    container_name: gid-admin-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-9091}:80'
    depends_on:
      - api


